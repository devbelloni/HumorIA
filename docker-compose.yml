name: humorai
services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  db:
    container_name: humorai-db
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-humorai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./humoria/humorai.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Aplicação PHP / Apache ──────────────────────────────────────────────────
  php:
    container_name: humorai-web
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_NAME: ${DB_NAME:-humorai}
      DB_PASSWORD: ${DB_PASSWORD}
      EMAIL_SENDER: ${EMAIL_SENDER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      DJANGO_URL: ${DJANGO_URL:-http://python:8000}
      DJANGO_USER: ${DJANGO_USER:-belloni}
      DJANGO_PASSWORD: ${DJANGO_PASSWORD}
    volumes:
      - ./humoria:/var/www/humoria
      - ./Script:/app
      - recordings_gsm:/var/www/humoria/recordings_gsm
      - "recordings_pcm:/var/www/humoria/recordings (3)"
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      db:
        condition: service_healthy

  # ── Worker Python (processamento de áudio + IA) ─────────────────────────────
  python:
    container_name: humorai-api
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_NAME: ${DB_NAME:-humorai}
      DB_PASSWORD: ${DB_PASSWORD}
      EMAIL_SENDER: ${EMAIL_SENDER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      NLTK_DATA_DOWNLOADED: "1"
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./Script:/app
      - "recordings_pcm:/var/www/humoria/recordings (3)"
      - recordings_gsm:/var/www/humoria/recordings_gsm
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  # ── Ollama (LLM local — llama3:8b) ─────────────────────────────────────────
  # Após o primeiro `docker compose up`, execute:
  #   docker compose exec ollama ollama pull llama3:8b
  ollama:
    container_name: humorai-ia
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Para usar GPU NVIDIA, descomente as linhas abaixo:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
# ── Administrador de Banco de Dados (Adminer) ──────────────────────────────
  adminer:
    container_name: humorai-adminer
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Facilita o login já deixando o host do banco preenchido
      ADMINER_DEFAULT_SERVER: db 
    depends_on:
      - db
volumes:
  mysql_data:
  recordings_gsm:
  recordings_pcm:
  ollama_models:
